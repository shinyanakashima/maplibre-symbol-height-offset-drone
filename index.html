<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Drone Mission 3D Viewer</title>
    <meta name="description" content="DJI WPML（KMZ）の飛行計画を MapLibre GL JS の symbol-height-offset で3D表示するビューア。ファイルはブラウザ内で処理され、外部に送信されません。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23212529'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23ffd43b' font-family='sans-serif' font-weight='bold'%3EH%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map"></div>

    <header class="topbar">
      <div class="brand">
        <strong>Drone Mission 3D Viewer</strong>
        <span class="sub">DJI WPML × MapLibre symbol-height-offset</span>
      </div>
      <div class="file-actions">
        <label class="btn primary" for="file-input">KMZを開く</label>
        <input id="file-input" type="file" accept=".kmz,.zip,application/vnd.google-earth.kmz" hidden />
        <select id="sample-select" aria-label="サンプルKMZ">
          <option value="">サンプルを選択</option>
        </select>
      </div>
    </header>

    <aside id="panel" class="panel">
      <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="true">パネル</button>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="plan" class="active">計画</button>
        <button role="tab" data-tab="waypoints">ウェイポイント</button>
        <button role="tab" data-tab="verify">高度検証</button>
        <button role="tab" data-tab="debug">デバッグ</button>
      </nav>
      <section id="tab-plan" class="tab-body active"></section>
      <section id="tab-waypoints" class="tab-body"></section>
      <section id="tab-verify" class="tab-body"></section>
      <section id="tab-debug" class="tab-body"></section>
    </aside>

    <div class="map-tools" role="toolbar" aria-label="表示切り替え">
      <div class="seg" data-group="basemap">
        <button data-value="std" class="active">地図</button>
        <button data-value="photo">写真</button>
      </div>
      <div class="seg" data-group="terrain">
        <button data-value="on" class="active">地形あり</button>
        <button data-value="off">地形なし</button>
      </div>
      <div class="seg" data-group="route">
        <button data-value="2d">経路2D</button>
        <button data-value="3d">経路3D</button>
        <button data-value="both" class="active">両方</button>
      </div>
      <label class="check"><input type="checkbox" id="drop-lines" checked /> 垂直線</label>
    </div>

    <div id="player" class="player" hidden>
      <button id="play" class="btn" type="button" aria-label="再生">再生</button>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="シークバー" />
      <select id="speed" aria-label="再生速度">
        <option value="1">×1</option>
        <option value="5">×5</option>
        <option value="10" selected>×10</option>
        <option value="30">×30</option>
      </select>
      <div id="player-info" class="player-info"></div>
    </div>

    <div id="empty-hint" class="empty-hint">
      <p><strong>KMZファイルをここにドラッグ＆ドロップ</strong></p>
      <p>または上のメニューからサンプルを選んでください。ファイルはブラウザ内だけで処理され、サーバーには送信されません。</p>
    </div>

    <div id="drop-overlay" class="drop-overlay" hidden><div>KMZをドロップして読み込み</div></div>
    <div id="toast" class="toast" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
